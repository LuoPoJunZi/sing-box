name: Auto Release

on:
  push:
    branches:
      - main
    paths:
      - '*.sh'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - '.editorconfig'
      - 'RELEASE_NOTES.md'
      - '.github/workflows/**'
  workflow_dispatch: # 手动触发按钮

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/lint.yml

  build-and-release:
    needs: checks
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract Version
        id: get_version
        run: |
          # 放宽正则容错率，并加入 || echo "" 防止 grep 找不到时直接崩溃
          VERSION=$(grep -oP 'is_sh_ver="\K[^"]+' src/init.sh | head -n 1 || echo "")
          
          if [ -z "$VERSION" ]; then
            echo "❌ 致命错误：无法在 src/init.sh 中找到 is_sh_ver 变量！请检查拼写。"
            exit 1
          fi
          
          echo "成功提取到版本号: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            TAG_EXISTS=true
          else
            TAG_EXISTS=false
          fi
          echo "TAG_EXISTS=$TAG_EXISTS" >> $GITHUB_ENV

      - name: Check if Release is Needed
        id: check_release
        run: |
          if [ "${{ env.TAG_EXISTS }}" = "true" ]; then
            echo "版本 ${{ env.VERSION }} 已存在，无需发布新 Release。自动跳过。"
            echo "should_release=false" >> $GITHUB_ENV
          else
            echo "检测到新版本: ${{ env.VERSION }}。准备自动发布！"
            echo "should_release=true" >> $GITHUB_ENV
          fi

      - name: Check Release Metadata
        if: env.should_release == 'true'
        run: |
          RELEASE_CHECK_STRICT_TAG=1 bash scripts/check-release.sh

      - name: Extract Release Notes
        if: env.should_release == 'true'
        run: |
          NOTES_FILE="RELEASE_NOTES.md"
          OUTPUT_FILE="${RUNNER_TEMP}/release-notes-${VERSION}.md"

          if [ ! -f "$NOTES_FILE" ]; then
            echo "❌ 缺少 $NOTES_FILE，无法生成 Release 描述。"
            exit 1
          fi

          awk -v version="$VERSION" '
            $0 == "## " version { in_version=1; next }
            in_version && /^## / { exit }
            in_version && /^### / && !in_section { in_section=1; print; next }
            in_section && /^### / { exit }
            in_section { print }
          ' "$NOTES_FILE" > "$OUTPUT_FILE"

          if [ ! -s "$OUTPUT_FILE" ]; then
            echo "❌ $NOTES_FILE 中没有找到 $VERSION 的主要变化说明。"
            exit 1
          fi

          echo "RELEASE_BODY=$OUTPUT_FILE" >> "$GITHUB_ENV"

      - name: Package Code
        if: env.should_release == 'true'
        # 将压缩包先生成在上一层目录，彻底避开“文件正在变化”的冲突，然后再移回来
        run: |
          tar -zcf ../code.tar.gz install.sh sing-box.sh src scripts tests LICENSE README.md README.en.md CONTRIBUTING.md RELEASE_NOTES.md docs
          mv ../code.tar.gz ./

      - name: Create Release
        if: env.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file "$RELEASE_BODY" \
            code.tar.gz
