name: Shell Lint

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck

      - name: Run shellcheck
        run: bash scripts/check-shell.sh

      - name: Run offline tests
        run: bash scripts/test.sh

  shfmt:
    name: shfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup shfmt
        uses: mfinelli/setup-shfmt@e52fd78d3a9a28dcf46656d4729c5d76be40ac0e # v4.0.1
        with:
          shfmt-version: "3.8.0"

      - name: Check formatting
        run: |
          shfmt -d -i 4 -ci -sr install.sh sing-box.sh src scripts tests

  sing-box-compat:
    name: recommended sing-box config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install compatibility test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Validate project configurations with the recommended sing-box release
        run: bash tests/integration/test-sing-box-release.sh

  structure:
    name: structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check module structure
        run: |
          bash scripts/check-structure.sh

  share-links:
    name: share links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install export test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Check share link helpers and fields
        run: |
          bash scripts/check-share-links.sh
          bash tests/integration/test-share-output.sh

  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check release metadata
        run: |
          bash scripts/check-release.sh
