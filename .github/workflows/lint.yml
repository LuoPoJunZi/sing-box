name: Shell Lint

on:
  push:
    branches:
      - main
    paths:
      - "*.sh"
      - "src/**/*.sh"
      - "scripts/**/*.sh"
      - ".editorconfig"
      - "CONTRIBUTING.md"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "*.sh"
      - "src/**/*.sh"
      - "scripts/**/*.sh"
      - ".editorconfig"
      - "CONTRIBUTING.md"
      - ".github/workflows/lint.yml"
  workflow_dispatch:

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: bash scripts/check-shell.sh

      - name: Test installer CLI
        run: bash scripts/test-install-cli.sh

      - name: Test command dispatch
        run: bash scripts/test-dispatch.sh

      - name: Test runtime safety
        run: bash scripts/test-runtime-safety.sh

  shfmt:
    name: shfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup shfmt
        uses: mfinelli/setup-shfmt@v3
        with:
          shfmt-version: "3.8.0"

      - name: Check formatting
        run: |
          shfmt -d -i 4 -ci -sr install.sh sing-box.sh src scripts

  structure:
    name: structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check module structure
        run: |
          bash scripts/check-structure.sh

  share-links:
    name: share links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install export test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Check share link helpers and fields
        run: |
          bash scripts/check-share-links.sh
          bash scripts/test-share-output.sh

  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check release metadata
        run: |
          bash scripts/check-release.sh
