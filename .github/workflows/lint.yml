name: Shell Lint

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y jq xz-utils
          source scripts/tool-versions.sh
          tool_dir="$(mktemp -d "${RUNNER_TEMP}/shellcheck.XXXXXX")"
          archive="${tool_dir}/shellcheck.tar.xz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            --output "$archive"
          printf '%s  %s\n' "$SHELLCHECK_LINUX_X86_64_SHA256" "$archive" | sha256sum --check --strict
          tar -xJf "$archive" -C "$tool_dir"
          echo "${tool_dir}/shellcheck-v${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"

      - name: Run shellcheck
        run: bash scripts/check-shell.sh

      - name: Run offline tests
        run: bash scripts/test.sh

  shfmt:
    name: shfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup shfmt
        uses: mfinelli/setup-shfmt@e52fd78d3a9a28dcf46656d4729c5d76be40ac0e # v4.0.1
        with:
          shfmt-version: "3.14.1"

      - name: Check formatting
        run: bash scripts/check-shfmt.sh

  sing-box-compat:
    name: recommended sing-box config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install compatibility test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Validate project configurations with the recommended sing-box release
        run: bash tests/integration/test-sing-box-release.sh

  structure:
    name: structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check module structure
        run: |
          bash scripts/check-structure.sh
          bash scripts/check-repo-hygiene.sh

  share-links:
    name: share links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install export test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Check share link helpers and fields
        run: |
          bash scripts/check-share-links.sh
          bash tests/integration/test-share-output.sh

  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check release metadata
        run: |
          bash scripts/check-release.sh
